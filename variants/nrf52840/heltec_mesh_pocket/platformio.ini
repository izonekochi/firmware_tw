[env:heltec-mesh-pocket-5000-inkhud-mod]
extends = env:heltec-mesh-pocket-5000-inkhud
build_flags = ${env:heltec-mesh-pocket-5000-inkhud.build_flags}
  -D MESHTASTIC_EXCLUDE_WIFI
  -D MESHTASTIC_EXCLUDE_GPS
  -D MESHTASTIC_EXCLUDE_AUDIO
  -D MESHTASTIC_EXCLUDE_DETECTIONSENSOR
  -D MESHTASTIC_EXCLUDE_ENVIRONMENTAL_SENSOR
  -D MESHTASTIC_EXCLUDE_EXTERNALNOTIFICATION
  -D MESHTASTIC_EXCLUDE_PAXCOUNTER
  -D MESHTASTIC_EXCLUDE_POWER_TELEMETRY
  -D MESHTASTIC_EXCLUDE_RANGETEST
  -D MESHTASTIC_EXCLUDE_REMOTEHARDWARE
  -D MESHTASTIC_EXCLUDE_STOREFORWARD
  -D MESHTASTIC_EXCLUDE_ATAK
  -D MESHTASTIC_EXCLUDE_POWERSTRESS
  -D MESHTASTIC_EXCLUDE_I2C
  -D MOD_CJK_ENABLED ; MOD to enable CJK support
  -D MOD_INPUT_MENU ; MOD to enable InputMenuApplet
  -D MOD_MESHPOCKET ; MOD to enable MeshPocket specific tunes
  -D MOD_UART_KEYBOARD_12KEY ; MOD to use Grove 12-key UART keyboard
